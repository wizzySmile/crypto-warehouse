name: Daily Crypto Update - Backup

on:
  schedule:
    - cron: '0 7 * * *'  # 8am Lagos time every day
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python crypto_warehouse.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}